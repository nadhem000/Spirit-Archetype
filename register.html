<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Register Test User</title>
		<style>
			body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
			.form-group { margin-bottom: 15px; }
			label { display: block; margin-bottom: 5px; }
			input { width: 100%; padding: 8px; }
			button { width: 100%; padding: 10px; background: #4a6fa5; color: white; border: none; }
			.message { margin-top: 15px; padding: 10px; }
			.success { background: #d4edda; color: #155724; }
			.error { background: #f8d7da; color: #721c24; }
		</style>
	</head>
	<body>
    <h1>Register Test User</h1>
    <form id="registerForm">
        <div class="form-group">
            <label>Username: <input type="text" id="username" required value="tester111" autocomplete="username"></label>
        </div>
        <div class="form-group">
            <label>Email: <input type="email" id="email" required value="tester111@gmail.com" autocomplete="email"></label>
        </div>
        <div class="form-group">
            <label>Password: <input type="password" id="password" required value="tester111@@@" autocomplete="new-password"></label>
        </div>
        <button type="submit">Register User</button>
    </form>
    <div id="message"></div>
    <p><a href="index.html">← Back to Main App</a></p>

    <!-- Load Supabase first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Wait for both the page AND Supabase to load
        function initializeApp() {
            // Check if Supabase is loaded
            if (typeof supabase === 'undefined') {
                console.log('Supabase not loaded yet, waiting...');
                setTimeout(initializeApp, 100);
                return;
            }
            
            console.log('Supabase loaded, initializing...');
            
            // Initialize Supabase
            const supabaseClient = supabase.createClient(
                'https://tgorqanvhjaecbysulih.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnb3JxYW52aGphZWNieXN1bGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwNTM3NjcsImV4cCI6MjA3NzYyOTc2N30.QD34e4pLSfUurerNlVXDb1vRWmQluPMuwDXSzaL1eoI'
            );

            // Enhanced password hashing using salt and multiple iterations (SAME AS MAIN APP)
            async function hashPassword(password) {
                // Generate a random salt
                const salt = crypto.getRandomValues(new Uint8Array(16));
                // Convert password to bytes
                const encoder = new TextEncoder();
                const passwordBuffer = encoder.encode(password);
                // Combine salt and password
                const combined = new Uint8Array(salt.length + passwordBuffer.length);
                combined.set(salt);
                combined.set(passwordBuffer, salt.length);
                // Hash with multiple iterations for better security
                let hashBuffer = await crypto.subtle.digest('SHA-256', combined);
                // Additional iteration for strengthening
                hashBuffer = await crypto.subtle.digest('SHA-256', hashBuffer);
                // Convert salt and hash to hex strings
                const saltHex = Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join('');
                const hashHex = Array.from(new Uint8Array(hashBuffer))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
                // Return salt + hash for storage
                return `${saltHex}.${hashHex}`;
            }

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Show loading state
                const submitButton = e.target.querySelector('button[type="submit"]');
                const originalText = submitButton.textContent;
                submitButton.textContent = 'Registering...';
                submitButton.disabled = true;
                
                try {
                    // Use the SAME hashing method as the main app
                    const hashedPassword = await hashPassword(password);
                    
                    const { data: user, error } = await supabaseClient
                        .from('auth_users')
                        .insert([{
                            username: username,
                            email: email,
                            hashed_password: hashedPassword,
                            profile: JSON.stringify({ test_user: true })
                        }])
                        .select();
                    
                    if (error) throw error;
                    
                    document.getElementById('message').innerHTML = 
                        `<div class="success">User ${username} registered successfully!</div>`;
                        
                } catch (error) {
                    document.getElementById('message').innerHTML = 
                        `<div class="error">Error: ${error.message}</div>`;
                } finally {
                    // Restore button
                    submitButton.textContent = originalText;
                    submitButton.disabled = false;
                }
            });
            
            console.log('Registration form initialized successfully!');
        }

        // Start the initialization when page loads
        window.addEventListener('load', initializeApp);
    </script>
</body>
</html>
