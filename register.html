<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Test User</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; }
        button { width: 100%; padding: 10px; background: #4a6fa5; color: white; border: none; }
        .message { margin-top: 15px; padding: 10px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Register Test User</h1>
    <form id="registerForm">
        <div class="form-group">
            <label>Username: <input type="text" id="username" required value="tester111"></label>
        </div>
        <div class="form-group">
            <label>Email: <input type="email" id="email" required value="tester111@gmail.com"></label>
        </div>
        <div class="form-group">
            <label>Password: <input type="password" id="password" required value="tester111@@@"></label>
        </div>
        <button type="submit">Register User</button>
    </form>
    <div id="message"></div>
    <p><a href="index.html">← Back to Main App</a></p>

    <!-- Load Supabase first -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Initialize Supabase immediately after loading the library
        const supabase = supabase.createClient(
            'https://tgorqanvhjaecbysulih.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRnb3JxYW52aGphZWNieXN1bGloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIwNTM3NjcsImV4cCI6MjA3NzYyOTc2N30.QD34e4pLSfUurerNlVXDb1vRWmQluPMuwDXSzaL1eoI'
        );

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // Simple password hash (for testing)
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashedPassword = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                const { data: user, error } = await supabase
                    .from('auth_users')
                    .insert([{
                        username: username,
                        email: email,
                        hashed_password: hashedPassword,
                        profile: JSON.stringify({ test_user: true })
                    }])
                    .select();
                
                if (error) throw error;
                
                document.getElementById('message').innerHTML = 
                    `<div class="success">User ${username} registered successfully!</div>`;
                    
            } catch (error) {
                document.getElementById('message').innerHTML = 
                    `<div class="error">Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
